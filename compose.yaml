services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: document_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3306:3306"
    volumes:
      - tracker_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utracker", "-ptracker_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tracker_mysql: